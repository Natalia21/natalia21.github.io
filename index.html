<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Космический полёт</title>
<style>
  body, html { margin: 0; padding: 0; overflow: hidden; background: black; }
  canvas { display: block; }

  #start {
    font-size: 20px;
    padding: 20px 40px;
    background: orange;
    color: #000000;
    text-transform: capitalize;
    border-radius: 8px;
    margin: 20px auto;
    display: block;
  }
</style>
</head>
<body>
  <button id="start"> start </button>
  <canvas id="game"></canvas>
  <audio id="explosionSound" preload="auto">
    <source src="./vzryiv.mp3" type="audio/mp3">
    Ваш браузер не поддерживает аудио.
  </audio>
  <script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let shipX = 0; // смещение корабля по X
let shipY = 0; // смещение корабля по Y

let meteors = [];
let explosions = [];

let isStart = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

resize();

const btn = document.getElementById('start');
const boom = document.getElementById('explosionSound');

if (!DeviceMotionEvent) {
  var DeviceMotionEvent = null;
}

function handleOrientation(e) {
  const gamma = e.gamma; // наклон влево/вправо
  const beta = e.beta;   // наклон вперёд/назад

  if (gamma === null || beta === null) return;

  let angle = (screen.orientation?.angle || window.orientation || 0) % 360;

  // Упростим ориентации
  if (angle < 0) angle += 360;

  let control = 0;

  if (angle === 0) {
    // Портрет
    control = gamma;
  } else if (angle === 90) {
    // Ландшафт, телефон повернут влево
    control = beta;
  } else if (angle === 270) {
    // Ландшафт, телефон повернут вправо
    control = -beta;
  } else {
    // fallback: используем gamma
    control = gamma;
  }

  // Иногда при наклоне "на себя" beta резко прыгает в 90+ — фильтруем
  if (!isFinite(control)) return;

  // Ограничим control, чтобы не скакал
  control = Math.max(-45, Math.min(45, control));

  let raw = control * 10; // чувствительность: 10–30
  shipX = Math.max(-canvas.width / 2, Math.min(canvas.width / 2, raw));
}

function handleMotion(event) {
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  // В landscape-режиме устройство лежит на боку,
  // поэтому X и Y тоже переворачиваются
  const orientation = (screen.orientation?.angle || window.orientation || 0) % 360;

  let control = 0;

  if (orientation === 90) {
    control = acc.y;  // телефон повернут влево
  } else if (orientation === 270 || orientation === -90) {
    control = -acc.y; // повернут вправо
  } else {
    control = acc.x;  // портретное положение
  }

  let raw = control * 20; // увеличим чувствительность
  shipX = Math.max(-canvas.width / 2, Math.min(canvas.width / 2, raw));
}


btn.addEventListener('click', () => {
  boom.play().then(() => {
    boom.pause();
    boom.currentTime = 0;
  });

  if (
    typeof DeviceMotionEvent !== 'undefined' &&
    typeof DeviceMotionEvent.requestPermission === 'function'
  ) {
    DeviceMotionEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          btn.style.display = 'none';
          isStart = true;
          window.addEventListener('devicemotion', handleMotion);
        } else {
          alert('Нет доступа к сенсорам 😔');
        }
      })
      .catch(console.error);
  } else {
    window.addEventListener('devicemotion', handleMotion);
    btn.style.display = 'none';
    isStart = true;
  }
});

function spawnMeteor() {
  meteors.push({
    x: Math.random() * canvas.width,
    y: -50,
    size: 20 + Math.random() * 30,
    speed: 4 + Math.random() * 12
  });
}

setInterval(spawnMeteor, 1000);

function createExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    explosions.push({
      x,
      y,
      radius: 2 + Math.random() * 4,
      speedX: (Math.random() - 0.5) * 6,
      speedY: (Math.random() - 0.5) * 6,
      life: 60
    });
  }
}

function drawShip(ctx, x, y) {
  // размеры
  const rocketWidth = 30;
  const rocketHeight = 60;
  const rocketX = x - rocketWidth / 2;
  const rocketY = y;

  // корпус
  ctx.fillStyle = "#ccc"; // светло-серый
  ctx.fillRect(rocketX, rocketY, rocketWidth, rocketHeight);

  // нос (треугольник)
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.moveTo(x, rocketY - 20);
  ctx.lineTo(rocketX, rocketY);
  ctx.lineTo(rocketX + rocketWidth, rocketY);
  ctx.closePath();
  ctx.fill();

  // крылья
  ctx.fillStyle = "red";

  // левое крыло
  ctx.beginPath();
  ctx.moveTo(rocketX, rocketY + 40);
  ctx.lineTo(rocketX - 20, rocketY + 60);
  ctx.lineTo(rocketX, rocketY + 60);
  ctx.closePath();
  ctx.fill();

  // правое крыло
  ctx.beginPath();
  ctx.moveTo(rocketX + rocketWidth, rocketY + 40);
  ctx.lineTo(rocketX + rocketWidth + 20, rocketY + 60);
  ctx.lineTo(rocketX + rocketWidth, rocketY + 60);
  ctx.closePath();
  ctx.fill();

  // иллюминаторы
  ctx.fillStyle = "#00ccff";
  ctx.beginPath();
  ctx.arc(x, rocketY + 15, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, rocketY + 30, 4, 0, Math.PI * 2);
  ctx.fill();

  // огонь
  const flameColors = ["orange", "yellow", "red"];
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.fillStyle = flameColors[i];
    const flameX = x + (Math.random() - 0.5) * 10;
    const flameY = rocketY + rocketHeight + Math.random() * 20;
    ctx.moveTo(x, rocketY + rocketHeight);
    ctx.lineTo(flameX, flameY);
    ctx.lineTo(x + 5, rocketY + rocketHeight);
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Нарисуем фон - звёзды
  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = "white";
    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
  }

  // координаты корабля
  const y = canvas.height * 0.5;
  const rocketWidth = 30;
  let x = canvas.width / 2 + shipX;
  x = Math.max(15, Math.min(canvas.width - 15, x));

  if (isStart) {
    // метеориты
    for (let i = 0; i < meteors.length; i++) {
      const m = meteors[i];
      m.y += m.speed;

      // тело метеорита — немного неровная форма
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.scale(1 + Math.random() * 0.1, 1 + Math.random() * 0.1); // немного искажаем
      ctx.beginPath();
      ctx.fillStyle = "#888"; // серый цвет метеорита
      ctx.arc(0, 0, m.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // кратеры
      const craterCount = 3 + Math.floor(Math.random() * 3);
      for (let j = 0; j < craterCount; j++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (m.size / 2 - 5);
        const craterX = m.x + Math.cos(angle) * dist;
        const craterY = m.y + Math.sin(angle) * dist;
        ctx.beginPath();
        ctx.fillStyle = "#444"; // тёмный кратер
        ctx.arc(craterX, craterY, 2 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // столкновение
      const dx = m.x - x;
      const dy = m.y - y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < m.size / 2 + 15) { // 15 — радиус "корабля"
        createExplosion(x, y);

        boom.currentTime = 0;
        boom.play();
      }
    }
  }

  // Нарисуем корабль
  drawShip(ctx, x, y);

  // Удалим метеориты за экраном
  meteors = meteors.filter(m => m.y < canvas.height + m.size);

  // взрывы
  for (let i = 0; i < explosions.length; i++) {
    const p = explosions[i];
    ctx.beginPath();
    ctx.fillStyle = `rgba(255, ${100 + Math.random() * 155}, 0, ${p.life / 60})`;
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.speedX;
    p.y += p.speedY;
    p.life--;
  }

  explosions = explosions.filter(p => p.life > 0);

  requestAnimationFrame(draw);
}
draw();
</script>
